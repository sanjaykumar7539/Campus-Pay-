<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merchant workspace · CampusPay</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="portal.css"></head>
<body class="role-app merchant-page" data-page="merchant"><aside class="sidebar" id="shellSidebar"></aside><div class="app-body"><header class="topbar" id="shellHeader"></header>
<main id="overview"><div class="page-heading"><div><p class="eyebrow">MERCHANT WORKSPACE</p><h1>Merchant dashboard</h1><span id="merchantName" hidden></span></div><a class="button accent" href="kiosk.html">Open ordering station</a></div>
<div class="grid merchant-stats" id="merchantStats"></div>
<div class="merchant-split"><div class="card merchant-action-card"><h2>Ordering station</h2><a class="button primary merchant-main-action" href="kiosk.html">Open ordering station</a></div>
<div class="card" id="recent"><div class="card-head"><h2>Recent paid orders</h2></div><label class="sr-only" for="orderSearch">Search orders</label><input class="search-field" id="orderSearch" type="search" placeholder="Search order reference"><div id="recentList"></div></div></div>
<section class="card"><h2>Canteen availability & menu</h2><p id="canteenStatus"></p><button id="toggleCanteen">Change availability</button><div id="merchantMsg" role="status"></div><form id="addProduct" class="inline-form"><label>Category<select id="merchantCategory" name="category_id" required></select></label><label>Item name<input name="name" required></label><label>Price &#8377;<input name="price_cu" type="number" min="1" step="1" required></label><label>Stock<input name="stock_quantity" type="number" min="0" step="1" required></label><button class="primary">Add item</button></form></section><section class="card"><div class="card-head"><h2>Live stock</h2></div><div class="table-wrap" id="merchantStock"></div></section><section id="queue"><h2 class="section-heading">Fulfillment queue</h2><div class="grid g2" id="cols"></div></section>
<footer class="dashboard-footer"><span>EGS PILLAY ENGINEERING COLLEGE / CampusPay</span><span>Live inventory · auto refresh</span></footer></main></div>
<script src="app.js"></script><script src="shell.js"></script><script src="merchant.js"></script></body></html>
